name: Validate Plugin

on:
  push:
    branches:
      - main
      - automation/sync-trayo-plugin
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publication
        run: node .github/scripts/validate-plugin.mjs

      # Claude Code's own schema check: it fails on manifests that `claude plugin install` rejects.
      # Validating the marketplace also validates trayo/.claude-plugin/plugin.json.
      - name: Validate with Claude Code
        run: npx --yes @anthropic-ai/claude-code@2.1.285 plugin validate .

      - name: Build Gemini CLI extension archive
        run: node .github/scripts/build-gemini-extension.mjs "$RUNNER_TEMP/gemini-extension" "$RUNNER_TEMP/trayo-gemini-extension.tar.gz"

      - name: Require version increase for plugin changes
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --no-tags
          if git diff --quiet origin/main...HEAD -- .claude-plugin .cursor-plugin README.md GEMINI.md gemini-extension.json trayo; then
            echo "No published plugin content changed."
            exit 0
          fi

          candidate="$(node .github/scripts/validate-plugin.mjs)"
          published="$(
            git show origin/main:.claude-plugin/marketplace.json \
              | jq -er '.plugins[] | select(.name == "trayo") | .version'
          )"
          node - "$candidate" "$published" <<'NODE'
          const [candidate, published] = process.argv.slice(2).map((version) =>
            version.split('.').map((part) => Number.parseInt(part, 10)),
          );
          const comparison = candidate.findIndex((part, index) => part !== published[index]);
          if (comparison === -1 || candidate[comparison] < published[comparison]) {
            console.error(
              `Plugin content changed without a version increase: candidate=${candidate.join('.')} published=${published.join('.')}`,
            );
            process.exit(1);
          }
          NODE
